name: release

on:
  push:
    tags: 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: fakelogs-linux-x64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: fakelogs-darwin-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: fakelogs-darwin-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: fakelogs-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout the source code
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: build (release)
      run: cargo build --release --locked --target ${{ matrix.target }}
    - name: compress
      if: runner.os != 'Windows'
      run: tar -czf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release fakelogs
    - name: compress (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path target/${{ matrix.target }}/release/fakelogs.exe -DestinationPath ${{ matrix.asset_name }}
    - name: store archive
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout the source code
      uses: actions/checkout@v7
    - name: download archives
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: add example config file
      run: cp example/fakejson.yaml dist/config.yaml
    - name: create release
      uses: softprops/action-gh-release@v3
      with:
        name: release ${{ github.ref_name }}
        files: dist/*
