# OpenTelemetry log records in OTLP/JSON, one ExportLogsServiceRequest per line.
# This is what the Collector's `file` exporter writes, so the output can be read
# back by its `otlpjsonfile` receiver, or POSTed to an OTLP/HTTP endpoint at /v1/logs.
# Attribute names follow the OpenTelemetry semantic conventions.
#
# severityNumber has to match severityText (DEBUG=5, INFO=9, WARN=13, ERROR=17),
# so each pattern has a fixed severity; weights make INFO the most common.
# Sub-second parts of the timestamps are random.
patterns:
  # INFO: HTTP request completed
  - pattern: '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:checkout|cart|payments|frontend}"}},{"key":"service.version","value":{"stringValue":"1.{int:0-9}.{int:0-20}"}},{"key":"deployment.environment.name","value":{"stringValue":"{choice:production|production|staging}"}},{"key":"host.name","value":{"stringValue":"ip-10-0-{int:0-255}-{int:1-254}"}},{"key":"telemetry.sdk.language","value":{"stringValue":"{choice:go|java|python|nodejs}"}}]},"scopeLogs":[{"scope":{"name":"{choice:net/http|io.opentelemetry.okhttp-3.0|opentelemetry.instrumentation.flask}"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":9,"severityText":"INFO","body":{"stringValue":"request completed"},"attributes":[{"key":"http.request.method","value":{"stringValue":"{choice:GET|GET|GET|POST|PUT|DELETE}"}},{"key":"url.path","value":{"stringValue":"/api/{word}/{int:1-99999}"}},{"key":"http.response.status_code","value":{"intValue":"{choice:200|200|200|201|204|304}"}},{"key":"client.address","value":{"stringValue":"{ipv4}"}},{"key":"http.server.request.duration_ms","value":{"doubleValue":{int:1-900}.{int:0-9}}}],"traceId":"{hex:32}","spanId":"{hex:16}","flags":1}]}]}]}'
    weight: 10

  # INFO: business event
  - pattern: '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:checkout|payments}"}},{"key":"service.version","value":{"stringValue":"1.{int:0-9}.{int:0-20}"}},{"key":"deployment.environment.name","value":{"stringValue":"production"}},{"key":"host.name","value":{"stringValue":"ip-10-0-{int:0-255}-{int:1-254}"}}]},"scopeLogs":[{"scope":{"name":"{choice:checkout|payments}.orders"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":9,"severityText":"INFO","body":{"stringValue":"order {choice:placed|paid|shipped|cancelled}"},"attributes":[{"key":"order.id","value":{"stringValue":"{uuid}"}},{"key":"user.id","value":{"stringValue":"{int:1-500000}"}},{"key":"order.amount","value":{"doubleValue":{int:1-999}.{int:10-99}}},{"key":"order.currency","value":{"stringValue":"{choice:USD|EUR|GBP|AUD}"}}],"traceId":"{hex:32}","spanId":"{hex:16}","flags":1}]}]}]}'
    weight: 3

  # INFO: background job
  - pattern: '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:worker|scheduler}"}},{"key":"deployment.environment.name","value":{"stringValue":"production"}},{"key":"k8s.namespace.name","value":{"stringValue":"{choice:default|jobs}"}},{"key":"k8s.pod.name","value":{"stringValue":"{choice:worker|scheduler}-{hex:10}-{hex:5}"}}]},"scopeLogs":[{"scope":{"name":"jobs"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":9,"severityText":"INFO","body":{"stringValue":"job {choice:started|finished} {word}"},"attributes":[{"key":"job.id","value":{"stringValue":"{uuid}"}},{"key":"job.attempt","value":{"intValue":"{int:1-3}"}}]}]}]}]}'
    weight: 3

  # WARN: slow database query
  - pattern: '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:checkout|cart|payments}"}},{"key":"deployment.environment.name","value":{"stringValue":"production"}},{"key":"host.name","value":{"stringValue":"ip-10-0-{int:0-255}-{int:1-254}"}}]},"scopeLogs":[{"scope":{"name":"database"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":13,"severityText":"WARN","body":{"stringValue":"slow query"},"attributes":[{"key":"db.system.name","value":{"stringValue":"{choice:postgresql|mysql}"}},{"key":"db.collection.name","value":{"stringValue":"{word}"}},{"key":"db.operation.name","value":{"stringValue":"{choice:SELECT|UPDATE|INSERT}"}},{"key":"db.query.duration_ms","value":{"intValue":"{int:500-9000}"}}],"traceId":"{hex:32}","spanId":"{hex:16}","flags":1}]}]}]}'
    weight: 2

  # ERROR: exception
  - '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:checkout|cart|payments|frontend}"}},{"key":"deployment.environment.name","value":{"stringValue":"production"}},{"key":"host.name","value":{"stringValue":"ip-10-0-{int:0-255}-{int:1-254}"}}]},"scopeLogs":[{"scope":{"name":"{choice:net/http|io.opentelemetry.okhttp-3.0}"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":17,"severityText":"ERROR","body":{"stringValue":"{choice:upstream request failed|payment provider timeout|database connection refused}"},"attributes":[{"key":"exception.type","value":{"stringValue":"{choice:ConnectionError|TimeoutError|java.net.SocketTimeoutException|context.DeadlineExceeded}"}},{"key":"exception.message","value":{"stringValue":"{sentence}"}},{"key":"server.address","value":{"stringValue":"{word}.internal"}},{"key":"server.port","value":{"intValue":"{choice:443|5432|6379|8080}"}}],"traceId":"{hex:32}","spanId":"{hex:16}","flags":1}]}]}]}'

  # DEBUG: cache lookup
  - pattern: '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"{choice:cart|frontend}"}},{"key":"deployment.environment.name","value":{"stringValue":"staging"}}]},"scopeLogs":[{"scope":{"name":"cache"},"logRecords":[{"timeUnixNano":"{unix}{int:100000000-999999999}","observedTimeUnixNano":"{unix}{int:100000000-999999999}","severityNumber":5,"severityText":"DEBUG","body":{"stringValue":"cache {choice:hit|hit|miss}"},"attributes":[{"key":"cache.key","value":{"stringValue":"{word}:{int:1-99999}"}},{"key":"db.system.name","value":{"stringValue":"redis"}}],"traceId":"{hex:32}","spanId":"{hex:16}","flags":1}]}]}]}'
    weight: 4

eps: 10
