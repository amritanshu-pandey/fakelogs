# Google Cloud Logging LogEntry records, as exported by a log sink (to Pub/Sub, GCS or BigQuery).
# https://cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
patterns:
  # GKE container log with a JSON payload
  - pattern: '{"insertId":"{hex:16}","jsonPayload":{"message":"{sentence}","service":"{choice:checkout|cart|frontend}","userId":"{int:1-500000}"},"resource":{"type":"k8s_container","labels":{"project_id":"example-project","location":"{choice:us-central1|europe-west1|australia-southeast1}","cluster_name":"prod-cluster","namespace_name":"{choice:default|prod}","pod_name":"{choice:checkout|cart|frontend}-{hex:10}-{hex:5}","container_name":"app"}},"timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000000-999999999}Z","severity":"{choice:INFO|INFO|INFO|WARNING|ERROR}","logName":"projects/example-project/logs/stdout","receiveTimestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000000-999999999}Z"}'
    weight: 20
  # External HTTP(S) load balancer request log
  - pattern: '{"insertId":"{hex:14}","jsonPayload":{"@type":"type.googleapis.com/google.cloud.loadbalancing.type.LoadBalancerLogEntry","statusDetails":"response_sent_by_backend","backendTargetProjectNumber":"projects/{int:100000000000-999999999999}"},"httpRequest":{"requestMethod":"{choice:GET|GET|GET|POST}","requestUrl":"https://{domain}.{tld}/{word}/{word}","requestSize":"{int:100-5000}","status":{choice:200|200|200|301|404|500|502},"responseSize":"{int:200-900000}","userAgent":"{choice:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36|curl/8.10.1}","remoteIp":"{ipv4}","serverIp":"10.128.{int:0-255}.{int:1-254}","latency":"0.{int:100000-999999}s"},"resource":{"type":"http_load_balancer","labels":{"project_id":"example-project","url_map_name":"web-map","forwarding_rule_name":"web-https","backend_service_name":"web-backend","target_proxy_name":"web-proxy","zone":"global"}},"timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000-999999}Z","severity":"INFO","logName":"projects/example-project/logs/requests","trace":"projects/example-project/traces/{hex:32}","receiveTimestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000000-999999999}Z","spanId":"{hex:16}"}'
    weight: 10
  # Cloud Audit Logs admin activity
  - '{"protoPayload":{"@type":"type.googleapis.com/google.cloud.audit.AuditLog","status":{},"authenticationInfo":{"principalEmail":"{username}@example.com"},"requestMetadata":{"callerIp":"{ipv4}","callerSuppliedUserAgent":"google-cloud-sdk gcloud/498.0.0 command/gcloud.compute.instances.{choice:create|delete|stop}"},"serviceName":"compute.googleapis.com","methodName":"v1.compute.instances.{choice:insert|delete|stop}","resourceName":"projects/example-project/zones/us-central1-a/instances/{word}-{int:1-99}","request":{"@type":"type.googleapis.com/compute.instances.insert"}},"insertId":"{hex:12}","resource":{"type":"gce_instance","labels":{"project_id":"example-project","zone":"us-central1-a","instance_id":"{int:1000000000000000000-9999999999999999999}"}},"timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000-999999}Z","severity":"NOTICE","logName":"projects/example-project/logs/cloudaudit.googleapis.com%2Factivity","operation":{"id":"operation-{unix}{int:100-999}-{hex:12}","producer":"compute.googleapis.com","first":true},"receiveTimestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100000000-999999999}Z"}'

eps: 10
