# GitHub organization / enterprise audit log events, as streamed or exported in JSON.
# @timestamp and created_at are milliseconds since the epoch.
patterns:
  - pattern: '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"git.clone","actor":"{username}","actor_location":{"country_code":"{choice:US|AU|GB|DE|IN}"},"business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","repo":"example-org/{choice:api|web|infra|mobile|docs}","repository_public":false,"transport_protocol":1,"transport_protocol_name":"http","user_agent":"git/2.47.0"}'
    weight: 30
  - '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"repo.create","actor":"{username}","actor_location":{"country_code":"{choice:US|AU|GB}"},"business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","repo":"example-org/{word}","visibility":"{choice:private|private|internal|public}","user_agent":"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Safari/605.1.15"}'
  - '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"protected_branch.{choice:update|destroy|policy_override}","actor":"{username}","business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","repo":"example-org/{choice:api|web|infra}","branch":"refs/heads/main","name":"main"}'
  - pattern: '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"org.{choice:add_member|remove_member|update_member}","actor":"{choice:org-admin|it-bot}","business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","user":"{username}","permission":"{choice:read|write|admin}"}'
    weight: 2
  - pattern: '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"personal_access_token.{choice:request_created|access_granted|access_revoked}","actor":"{username}","business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","user":"{username}","token_id":{int:1000000-9999999},"token_scopes":"{choice:repo|repo,workflow|read:org}"}'
    weight: 2
  - pattern: '{"@timestamp":{unix}{int:100-999},"_document_id":"{hex:22}","action":"workflows.completed_workflow_run","actor":"{username}","business":"example-corp","created_at":{unix}{int:100-999},"org":"example-org","repo":"example-org/{choice:api|web|infra}","workflow_id":{int:10000000-99999999},"workflow_run_id":{int:1000000000-9999999999},"conclusion":"{choice:success|success|success|failure|cancelled}","head_branch":"{choice:main|main|feature/login|fix/timeout|dependabot/npm_and_yarn/axios-1.7.7}","event":"{choice:push|pull_request|schedule}"}'
    weight: 20

eps: 10
