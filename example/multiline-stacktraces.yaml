# Multi-line events: Java (Spring Boot / Logback) and Python stack traces mixed with normal lines.
# Good for testing multi-line parsing in log shippers, like the OpenTelemetry Collector's
# recombine operator or Fluent Bit's multiline parsers.
# Double-quoted YAML strings turn \n into a line break and \t into a tab.
patterns:
  - pattern: "{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z  INFO {int:1000-9999} --- [shop] [nio-8080-exec-{int:1-9}] c.e.shop.OrderController                : Order {int:1-999999} created for user {int:1-500000}"
    weight: 20
  - "{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z ERROR {int:1000-9999} --- [shop] [nio-8080-exec-{int:1-9}] o.a.c.c.C.[.[.[/].[dispatcherServlet]    : Servlet.service() for servlet [dispatcherServlet] threw exception\njava.lang.NullPointerException: Cannot invoke \"com.example.shop.Customer.getAddress()\" because \"customer\" is null\n\tat com.example.shop.ShippingService.quote(ShippingService.java:{int:40-400})\n\tat com.example.shop.OrderService.checkout(OrderService.java:{int:40-400})\n\tat com.example.shop.OrderController.checkout(OrderController.java:{int:20-200})\n\tat java.base/jdk.internal.reflect.DirectMethodHandleAccessor.invoke(DirectMethodHandleAccessor.java:103)\n\tat java.base/java.lang.reflect.Method.invoke(Method.java:580)\n\tat org.springframework.web.method.support.InvocableHandlerMethod.doInvoke(InvocableHandlerMethod.java:255)\n\tat org.springframework.web.servlet.FrameworkServlet.service(FrameworkServlet.java:885)\n\t... {int:20-90} common frames omitted"
  - "{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z ERROR {int:1000-9999} --- [shop] [nio-8080-exec-{int:1-9}] c.e.shop.PaymentClient                   : Payment request failed\norg.springframework.web.client.ResourceAccessException: I/O error on POST request for \"https://payments.internal/charge\": Read timed out\n\tat org.springframework.web.client.RestTemplate.createResourceAccessException(RestTemplate.java:915)\n\tat org.springframework.web.client.RestTemplate.doExecute(RestTemplate.java:895)\n\tat com.example.shop.PaymentClient.charge(PaymentClient.java:{int:20-200})\nCaused by: java.net.SocketTimeoutException: Read timed out\n\tat java.base/sun.nio.ch.NioSocketImpl.timedRead(NioSocketImpl.java:278)\n\tat java.base/sun.nio.ch.NioSocketImpl.implRead(NioSocketImpl.java:304)\n\t... {int:10-40} more"
  - pattern: "{year}-{month}-{day} {hour}:{minute}:{second},{int:100-999} INFO [worker] processed job {uuid} in {int:1-9000} ms"
    weight: 20
  - "{year}-{month}-{day} {hour}:{minute}:{second},{int:100-999} ERROR [worker] job {uuid} failed\nTraceback (most recent call last):\n  File \"/app/worker/tasks.py\", line {int:20-300}, in run\n    result = handler(payload)\n             ^^^^^^^^^^^^^^^^\n  File \"/app/worker/handlers.py\", line {int:20-300}, in send_invoice\n    customer = payload[\"customer\"]\n               ~~~~~~~^^^^^^^^^^^^\nKeyError: 'customer'"

eps: 10
