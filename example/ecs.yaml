# Elastic Common Schema (ECS) JSON logs, as written by the Elastic ECS logging libraries.
# https://www.elastic.co/guide/en/ecs/current/ecs-reference.html
patterns:
  - pattern: '{"@timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z","log.level":"info","message":"{choice:GET|GET|POST|PUT} /api/{word}","ecs.version":"8.11.0","service.name":"{choice:checkout|cart|search}","service.version":"1.{int:0-9}.{int:0-20}","service.environment":"production","event.dataset":"{choice:checkout|cart|search}.access","event.duration":{int:100000-900000000},"http.request.method":"{choice:GET|GET|POST|PUT}","http.response.status_code":{choice:200|200|200|201|404|500},"url.path":"/api/{word}","client.ip":"{ipv4}","user_agent.original":"{choice:curl/8.10.1|okhttp/4.12.0}","host.hostname":"ip-10-0-{int:0-255}-{int:1-254}","trace.id":"{hex:32}","transaction.id":"{hex:16}"}'
    weight: 10
  - '{"@timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z","log.level":"error","message":"{choice:Payment failed|Inventory reservation failed|Search backend unavailable}","ecs.version":"8.11.0","service.name":"{choice:checkout|cart|search}","service.environment":"production","event.dataset":"{choice:checkout|cart|search}.log","log.logger":"{choice:payments.client|inventory.client|search.client}","error.type":"{choice:TimeoutError|ConnectionRefusedError|HTTPError}","error.message":"{sentence}","host.hostname":"ip-10-0-{int:0-255}-{int:1-254}","trace.id":"{hex:32}"}'
  - pattern: '{"@timestamp":"{year}-{month}-{day}T{hour}:{minute}:{second}.{int:100-999}Z","log.level":"info","message":"user authenticated","ecs.version":"8.11.0","service.name":"auth","event.category":["authentication"],"event.type":["start"],"event.outcome":"{choice:success|success|success|failure}","user.name":"{username}","source.ip":"{ipv4}","host.hostname":"ip-10-0-{int:0-255}-{int:1-254}"}'
    weight: 3

eps: 10
