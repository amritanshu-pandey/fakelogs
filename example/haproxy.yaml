# HAProxy logs with a syslog header, in the default "option httplog" and
# "option tcplog" formats. Milliseconds in the accept date are random.
#   HTTP: client:port [accept_date] frontend backend/server Tq/Tw/Tc/Tr/Ta status bytes - - ---- actconn/feconn/beconn/srv_conn/retries srv_queue/backend_queue "request"
#   TCP:  client:port [accept_date] frontend backend/server Tw/Tc/Tt bytes ---- actconn/feconn/beconn/srv_conn/retries srv_queue/backend_queue
patterns:
  - pattern: '{month_name} {day} {hour}:{minute}:{second} lb{int:1-3} haproxy[{int:1000-65000}]: {ipv4}:{int:1024-65535} [{day}/{month_name}/{year}:{hour}:{minute}:{second}.{int:100-999}] {choice:http-in|https-in}~ {choice:web|api|static}/srv{int:1-4} {int:0-20}/0/{int:0-5}/{int:1-900}/{int:1-1000} {choice:200|200|200|200|201|301|304|404|500|503} {int:100-90000} - - ---- {int:1-500}/{int:1-400}/{int:0-100}/{int:0-50}/0 0/0 "{choice:GET|GET|POST|PUT} /{word}/{word} HTTP/1.1"'
    weight: 20
  - pattern: '{month_name} {day} {hour}:{minute}:{second} lb{int:1-3} haproxy[{int:1000-65000}]: {ipv4}:{int:1024-65535} [{day}/{month_name}/{year}:{hour}:{minute}:{second}.{int:100-999}] {choice:mysql|redis|ldap} {choice:mysql|redis|ldap}_back/db{int:1-3} 0/{int:0-5}/{int:10-60000} {int:100-500000} -- {int:1-500}/{int:1-50}/{int:0-50}/{int:0-20}/0 0/0'
    weight: 4
  - '{month_name} {day} {hour}:{minute}:{second} lb{int:1-3} haproxy[{int:1000-65000}]: Server {choice:web|api|static}/srv{int:1-4} is {choice:DOWN|UP}, reason: Layer4 {choice:connection problem|check passed}, check duration: {int:0-2000}ms. {int:0-4} active and 0 backup servers left. 0 sessions active, 0 requeued, 0 remaining in queue.'

eps: 10
