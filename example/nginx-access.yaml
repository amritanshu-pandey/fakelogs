# nginx access log, default "combined" format (also Apache's combined format):
#   $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
patterns:
  - pattern: '{ipv4} - - [{day}/{month_name}/{year}:{hour}:{minute}:{second} +0000] "{choice:GET|GET|GET|POST|PUT|DELETE|HEAD} /{choice:api|static|assets|blog|products}/{word}{choice:|.html|.js|.css|.png} HTTP/{choice:1.1|1.1|2.0}" {choice:200|200|200|200|200|201|204|301|302|304|400|401|403|404|404|500|502|503} {int:0-50000} "{choice:-|-|https://www.google.com/|https://duckduckgo.com/|https://example.com/}" "{choice:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36|Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Safari/605.1.15|Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:131.0) Gecko/20100101 Firefox/131.0|curl/8.10.1|python-requests/2.32.3|Googlebot/2.1 (+http://www.google.com/bot.html)}"'
    weight: 9
  - '{ipv4} - {username} [{day}/{month_name}/{year}:{hour}:{minute}:{second} +0000] "POST /api/{word}/{int:1-99999} HTTP/1.1" {choice:200|201|400|401|422} {int:20-2000} "-" "{choice:okhttp/4.12.0|Go-http-client/2.0|axios/1.7.7}"'

eps: 10
