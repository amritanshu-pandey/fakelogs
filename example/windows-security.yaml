# Windows Security event log entries as flat JSON, the way NXLog and similar agents ship them.
# Each pattern is one event ID with its matching fields:
#   4624 logon, 4625 failed logon, 4672 special privileges, 4688 process created,
#   4720 user created, 4740 account locked out
patterns:
  - pattern: '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"{choice:WIN-DC01|WIN-FS02|WS-0142|WS-0317|WS-0588}.corp.example.com","Keywords":"Audit Success","EventType":"AUDIT_SUCCESS","SeverityValue":2,"Severity":"INFO","EventID":4624,"SourceName":"Microsoft-Windows-Security-Auditing","ProviderGuid":"{54849625-5478-4994-A5BA-3E3B0328C30D}","Channel":"Security","Category":"Logon","Opcode":"Info","TargetUserSid":"S-1-5-21-{int:1000000000-3999999999}-{int:1000000000-3999999999}-{int:1000000000-3999999999}-{int:1000-9999}","TargetUserName":"{username}","TargetDomainName":"CORP","TargetLogonId":"0x{hex:7}","LogonType":{choice:2|3|3|3|10},"LogonProcessName":"{choice:User32|NtLmSsp|Kerberos}","AuthenticationPackageName":"{choice:Negotiate|NTLM|Kerberos}","WorkstationName":"WS-{int:100-999}","IpAddress":"10.0.{int:0-255}.{int:1-254}","IpPort":"{int:1024-65535}","Message":"An account was successfully logged on."}'
    weight: 20
  - pattern: '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"{choice:WIN-DC01|WIN-FS02}.corp.example.com","Keywords":"Audit Failure","EventType":"AUDIT_FAILURE","SeverityValue":4,"Severity":"ERROR","EventID":4625,"SourceName":"Microsoft-Windows-Security-Auditing","Channel":"Security","Category":"Logon","Opcode":"Info","TargetUserName":"{choice:administrator|admin|backup|guest}","TargetDomainName":"CORP","Status":"0xc000006d","FailureReason":"%%2313","SubStatus":"{choice:0xc000006a|0xc000006a|0xc0000064|0xc0000072}","LogonType":{choice:3|3|10},"LogonProcessName":"NtLmSsp","AuthenticationPackageName":"NTLM","WorkstationName":"{choice:-|KALI|DESKTOP-7F3K2LQ}","IpAddress":"{ipv4}","IpPort":"{int:1024-65535}","Message":"An account failed to log on."}'
    weight: 4
  - pattern: '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"WIN-DC01.corp.example.com","Keywords":"Audit Success","EventType":"AUDIT_SUCCESS","SeverityValue":2,"Severity":"INFO","EventID":4672,"SourceName":"Microsoft-Windows-Security-Auditing","Channel":"Security","Category":"Special Logon","SubjectUserName":"{choice:administrator|svc-backup|svc-sql}","SubjectDomainName":"CORP","SubjectLogonId":"0x{hex:7}","PrivilegeList":"SeSecurityPrivilege\r\n\t\t\tSeBackupPrivilege\r\n\t\t\tSeRestorePrivilege\r\n\t\t\tSeDebugPrivilege","Message":"Special privileges assigned to new logon."}'
