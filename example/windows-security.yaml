  - pattern: '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"WS-{int:100-999}.corp.example.com","Keywords":"Audit Success","EventType":"AUDIT_SUCCESS","SeverityValue":2,"Severity":"INFO","EventID":4688,"SourceName":"Microsoft-Windows-Security-Auditing","Channel":"Security","Category":"Process Creation","SubjectUserName":"{username}","SubjectDomainName":"CORP","NewProcessId":"0x{hex:4}","NewProcessName":"C:\\Windows\\System32\\{choice:cmd.exe|WindowsPowerShell\\v1.0\\powershell.exe|whoami.exe|net.exe|schtasks.exe}","TokenElevationType":"%%1936","ProcessId":"0x{hex:4}","CommandLine":"{choice:cmd.exe /c whoami|powershell.exe -NoProfile -EncodedCommand SQBFAFgA|net user /domain|schtasks /query /fo LIST}","ParentProcessName":"C:\\Windows\\explorer.exe","Message":"A new process has been created."}'
    weight: 15
  - '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"WIN-DC01.corp.example.com","Keywords":"Audit Success","EventType":"AUDIT_SUCCESS","SeverityValue":2,"Severity":"INFO","EventID":4720,"SourceName":"Microsoft-Windows-Security-Auditing","Channel":"Security","Category":"User Account Management","TargetUserName":"{username}","TargetDomainName":"CORP","SubjectUserName":"{choice:administrator|helpdesk}","SubjectDomainName":"CORP","SamAccountName":"{username}","UserAccountControl":"%%2080 %%2082 %%2084","Message":"A user account was created."}'
  - '{"EventTime":"{year}-{month}-{day} {hour}:{minute}:{second}","Hostname":"WIN-DC01.corp.example.com","Keywords":"Audit Success","EventType":"AUDIT_SUCCESS","SeverityValue":2,"Severity":"INFO","EventID":4740,"SourceName":"Microsoft-Windows-Security-Auditing","Channel":"Security","Category":"User Account Management","TargetUserName":"{username}","TargetDomainName":"WS-{int:100-999}","SubjectUserName":"WIN-DC01$","SubjectDomainName":"CORP","Message":"A user account was locked out."}'

